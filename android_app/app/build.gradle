plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.soundbaropti.livesub'
    compileSdk 34

    defaultConfig {
        applicationId "com.soundbaropti.livesub"
        minSdk 28
        targetSdk 34
        versionCode 6
        versionName "2.5"
    }

    // Fixed signing key (committed to repo) so every new build installs cleanly OVER the previous one.
    // A changing key between builds is what causes Android's "App not installed" error.
    signingConfigs {
        livesub {
            storeFile file('livesub.keystore')
            storePassword 'livesub123'
            keyAlias 'livesub'
            keyPassword 'livesub123'
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        debug {
            if (file('livesub.keystore').exists()) { signingConfig signingConfigs.livesub }
            minifyEnabled false
        }
        release {
            if (file('livesub.keystore').exists()) { signingConfig signingConfigs.livesub }
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // Pure Android SDK: zero external library bloat, ultra-fast <1s APK install
}
